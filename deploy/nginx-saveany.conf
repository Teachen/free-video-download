# ============================================================
# Nginx 反向代理配置（后端 API）
# 放置：/etc/nginx/sites-available/saveany  → 软链到 sites-enabled
# 说明：
#   - AI 总结走 SSE 流式，必须关闭 proxy_buffering，否则前端收不到流
#   - 上传/下载视频体积大，放宽 client_max_body_size 与超时
# ============================================================

server {
    listen 80;
    server_name api.your-domain.com;   # 改成你的域名

    # 前端构建产物（如前端与后端同域部署）
    # root /opt/saveany/frontend/dist;
    # index index.html;

    # 申请证书后可启用下面两行自动跳转 HTTPS
    # location / { return 301 https://$host$request_uri; }

    client_max_body_size 500m;

    # ---------- 后端 API ----------
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE 流式输出关键配置：禁用缓冲、延长超时
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Connection '';
        chunked_transfer_encoding on;

        proxy_connect_timeout 60s;
        proxy_send_timeout    600s;
        proxy_read_timeout    600s;
    }

    # ---------- 健康检查 ----------
    location = /health {
        proxy_pass http://127.0.0.1:8000/api/health;
        access_log off;
    }
}

# ============================================================
# HTTPS 版本（用 certbot 申请证书后可用）
#   sudo certbot --nginx -d api.your-domain.com
# certbot 会自动改写上面的 server 块，通常无需手工维护这一段。
# ============================================================
