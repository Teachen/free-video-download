# 一键部署（云服务器）
#   1. cp deploy/.env.deploy.example .env.deploy 然后填写真实值
#   2. docker compose up -d --build
#   3. docker compose logs -f
#
# 说明：
#   - 后端监听宿主机 8000 端口，前面建议用 Nginx 反代 + HTTPS
#   - downloads / data 挂载到宿主机，容器重建不丢数据
#   - B 站登录态通过 BILI_COOKIE 环境变量注入（服务器无浏览器）

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: saveany-backend:latest
    container_name: saveany-backend
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"   # 仅本机可访问，由 Nginx 反代对外
    env_file:
      - ./.env.deploy
    environment:
      - TZ=Asia/Shanghai
    volumes:
      - ./backend/downloads:/app/downloads
      - ./backend/data:/app/data
      - ./backend/logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
